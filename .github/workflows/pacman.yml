# Generates the Pac-Man contribution graph and publishes it to the `output`
# branch, so nothing here ever commits to main.
#
# That separation matters: the workflow this repo used to run for the 3D
# calendar committed to main on every push, which raced the profile card job
# and failed it. Publishing to a detached branch cannot collide with anything.
name: Generate Pac-Man Graph

on:
  # The contribution data comes from the GitHub API, so there is no source
  # file to watch -- a daily run is the whole story.
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

  # Only this file. Enough to seed the output branch on the first push,
  # without adding a run to every unrelated commit the way the workflows this
  # repo used to carry did.
  push:
    branches: [main]
    paths:
      - ".github/workflows/pacman.yml"

permissions:
  contents: write

concurrency:
  group: pacman
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Both actions are pinned to a commit SHA rather than a tag or branch.
      # They run with contents:write on this repo, and a tag can be moved by
      # its author while a SHA cannot. Comments record the version each SHA is.
      - name: Generate the graph SVGs into ./dist
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          hide_month_labels: "false"

      - name: Publish ./dist to the output branch
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh Pac-Man contribution graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
