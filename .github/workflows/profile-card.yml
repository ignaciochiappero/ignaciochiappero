# Refreshes the neofetch-style profile card (dark_mode.svg / light_mode.svg).
#
# fetch_stats.py hits the GitHub GraphQL API and caches the expensive
# lines-of-code walk in cache/loc.json; build_card.py then regenerates both
# SVGs from assets/ascii-art.txt + cache/stats.json. The cache is committed
# back so the next run only walks repos whose head commit actually moved.
name: Update Profile Card

on:
  # Refresh the numbers once a day.
  schedule:
    - cron: "0 5 * * *"

  workflow_dispatch:

  # Rebuild immediately when the art or the generator changes -- but not on
  # every unrelated push, which would just add commit noise.
  push:
    branches: [main]
    paths:
      - "assets/ascii-art.txt"
      - "tools/**"
      - ".github/workflows/profile-card.yml"

permissions:
  contents: write

# A scheduled run and a manual run overlapping would race on the same commit.
concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch GitHub stats
        env:
          # A PAT with read:user is needed for private contribution counts;
          # without it the built-in token still covers all public figures.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/fetch_stats.py

      - name: Rebuild the card
        run: python tools/build_card.py

      - name: Commit the regenerated card
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile card stats"
          branch: main
          file_pattern: "*.svg cache/*.json"
